name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `swarmctl ...`
        2. ...
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: orchestrator, manager, dashboard, bus, swarmctl, autopilot...
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version, agent CLI and version, and the commit you run.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from `swarmctl logs` or `swarmctl doctor`. Remove tokens, IPs and names first.
      render: text
