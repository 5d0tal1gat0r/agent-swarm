# Department ownership for the swarm. One department per path: overlapping
# globs stop the orchestrator at start-up. Paths not owned by any department
# go to `platform` and raise alert.unowned_path. Hosts are GitHub logins.
#
# As shipped, this file points the swarm at its own code (the swarm can develop
# itself). For your project: set `repo` to the GitHub repository the swarm
# works on, then replace the departments with your own areas (paths, the agent
# each one uses, and how many tasks it runs at once). See README, "Configure it
# for your repository".
version: 1
repo: your-org/agent-swarm
contracts:
  - "swarm/protocol/**"
departments:
  core:
    paths: ["swarm/orchestrator/**", "swarm/protocol/**", "swarm/prompts/orchestrator-*.md", "swarm/dashboard/**"]
    host: owner
    standby: null
    agent: claude
    concurrency: 1
    maxSubagents: 4
  runtime:
    paths:
      - "swarm/manager/**"
      - "swarm/agents/**"
      - "swarm/shared/**"
      - "swarm/prompts/manager-*.md"
      - "autopilot/src/**"
      - "autopilot/bin/**"
      - "autopilot/test/**"
      - "autopilot/prompts/**"
      - "autopilot/sandbox/**"
      - "autopilot/*.json"
    host: owner
    standby: null
    agent: claude
    concurrency: 1
    maxSubagents: 4
  qa:
    paths: ["swarm/test/**", "swarm/fixtures/**"]
    host: owner
    standby: null
    agent: claude
    concurrency: 1
    maxSubagents: 3
  platform:
    paths:
      - ".github/**"
      - "scripts/**"
      - "swarm/deploy/**"
      - "swarm/scripts/**"
      - "swarm/sandbox/**"
      - "swarm/policy.yaml"
      - "swarm/departments.yaml"
      - "swarm/package.json"
      - "swarm/package-lock.json"
      - ".mcp.json"
      - ".env.example"
      - ".gitignore"
    host: owner
    standby: null
    agent: claude
    concurrency: 1
    maxSubagents: 3
  docs:
    paths:
      - "docs/**"
      - "prompts/**"
      - "*.md"
      - "swarm/README.md"
      - "swarm/ARCHITECTURE.md"
      - "swarm/managers/**"
      - "autopilot/README.md"
    host: owner
    standby: null
    agent: claude
    concurrency: 1
    maxSubagents: 2
